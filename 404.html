<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Off the trail — Scarecrow Scavenger Hunt</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; background: #f7f1e3; color: #2b2b2b;
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  main { text-align: center; max-width: 480px; background: rgba(255,253,246,.92);
    border: 1px solid rgba(200,90,23,.35); border-radius: 18px; padding: 34px 30px;
    box-shadow: 0 8px 30px rgba(120,72,20,.15); }
  h1 { color: #173f6b; margin: 0 0 10px; }
  p { color: #4a4033; line-height: 1.6; }
  a { color: #c85a17; font-weight: 700; }
  .leaf { font-size: 44px; }
</style>
</head>
<body>
  <main>
    <div class="leaf" aria-hidden="true"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#d9481c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></div>
    <h1>Off the trail?</h1>
    <p>That page blew away like a leaf in the wind. Taking you back to the Scarecrow Hunt&hellip;</p>
    <p><a href="/">Back to the hunt now</a></p>
  </main>
<script>
/* Legacy QR cards (first print run, Sep 22) encode the old GitHub Pages host
   (kmberry1989.github.io/scarecrow-hunt/sNN.html). GitHub redirects those to
   this domain preserving the path, which lands here — send hunters straight
   to the right stop page instead of the generic off-trail fallback. */
(function () {
  var m = /^\/scarecrow-hunt\/(s\d{2})\.html$/i.exec(location.pathname);
  if (m) {
    var n = parseInt(m[1].slice(1), 10);
    if (n >= 1 && n <= 21) {
      location.replace("https://kokomoscarecrows.com/" + m[1].toLowerCase() + ".html");
      return;
    }
  }
  setTimeout(function(){ location.replace("/"); }, 2600);
})();
</script>
<!-- scan-fab: compact floating camera button -->
<style>
#letsGoFab { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 9000;
  width: 58px; height: 58px; border-radius: 50%; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #d9481c, #e8722a 60%, #e8a33d); color: #fff;
  border: 2px solid rgba(255,255,255,.5); cursor: pointer;
  box-shadow: 0 6px 24px rgba(217,72,28,.55); animation: letsgo-pulse 2.6s ease-in-out infinite; }
#letsGoFab .ico { width: 27px; height: 27px; }
#letsGoFab:active { transform: scale(.93); }
@keyframes letsgo-pulse { 0%, 100% { box-shadow: 0 6px 24px rgba(217,72,28,.55); } 50% { box-shadow: 0 6px 32px rgba(232,163,61,.85); } }
@media (prefers-reduced-motion: reduce) { #letsGoFab { animation: none; } }
</style>
<button type="button" id="letsGoFab" aria-label="Scan a scarecrow QR code" title="Scan a scarecrow QR code"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" /><circle cx="12" cy="13" r="3" /></svg></button>
<script>
(function () {
  var go = document.getElementById("letsGoFab");
  if (!go) return;
  function dodge() {
    try {
      var fab = document.querySelector(".solve-replay-fab");
      go.style.bottom = (fab && !fab.hidden) ? "88px" : "18px";
    } catch (e) {}
  }
  dodge();
  try {
    var fab0 = document.querySelector(".solve-replay-fab");
    if (fab0 && window.MutationObserver) {
      new MutationObserver(dodge).observe(fab0, { attributes: true, attributeFilter: ["hidden"] });
    }
  } catch (e) {}
  go.addEventListener("click", function () {
    dodge();
    if (window.HuntSfx) { try { window.HuntSfx.click(); } catch (e) {} }
    var local = document.getElementById("scanBtn");
    if (local) { local.click(); return; }
    location.href = "map.html#scan";
  });
})();
</script>

</body>
</html>
