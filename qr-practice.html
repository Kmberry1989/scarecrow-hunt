<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You did it! &mdash; Scarecrow Scavenger Hunt QR practice</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:
    repeating-linear-gradient(0deg, rgba(23,63,107,.055) 0 2px, transparent 2px 52px),
    repeating-linear-gradient(90deg, rgba(23,63,107,.055) 0 2px, transparent 2px 52px),
    #f7f1e3; color: #4c4132; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 1.5rem; text-align: center; }
  .card { background: #fffdf6; border: 2px solid #e7d9bd; border-radius: 20px;
    box-shadow: 0 18px 50px rgba(120,72,20,.25); padding: 2.5rem 2rem; max-width: 520px; width: 100%; }
  .kicker { font-size: .8rem; letter-spacing: 3px; text-transform: uppercase; color: #c85a17;
    font-weight: 700; margin-bottom: .75rem; }
  #count { font-size: clamp(5rem, 22vw, 8rem); font-weight: 800; color: #173f6b; line-height: 1;
    margin: .5rem 0 1rem; font-variant-numeric: tabular-nums;
    transition: transform .3s ease, opacity .3s ease; }
  #count.tick { transform: scale(1.12); opacity: .85; }
  #msg { font-size: 1.15rem; line-height: 1.55; }
  #msg h1 { font-size: 1.7rem; color: #173f6b; margin-bottom: .75rem; }
  #msg .back { margin-top: 1.25rem; font-size: .95rem; color: #8a6f4d; }
  .btn { display: inline-block; margin-top: 1rem; padding: .9rem 2.2rem; border-radius: 999px;
    background: linear-gradient(135deg,#d9481c,#e8722a 60%,#e8a33d); color: #fff; font-weight: 800;
    font-size: 1.05rem; text-decoration: none; box-shadow: 0 8px 24px rgba(217,72,28,.45); }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) {
    #count { transition: none; }
    #count.tick { transform: none; }
  }
</style>
</head>
<body>
  <main class="card" aria-live="polite">
    <p class="kicker">QR practice</p>
    <div id="stage-count">
      <p id="msg"><strong>Nice scan!</strong> Counting down&hellip;</p>
      <div id="count">5</div>
    </div>
    <div id="stage-hooray" class="hidden">
      <div id="msg">
        <h1>Hooray! You did it!</h1>
        <p>You&rsquo;re all set for the <strong>First Friday Scarecrow Scavenger Hunt</strong>. When you spot a pumpkin&rsquo;s QR code downtown, just do exactly what you did here.</p>
        <p class="back">Taking you back to the hunt&hellip;</p>
        <a class="btn" href="index.html">Take me to the hunt now</a>
      </div>
    </div>
  </main>
<script>
(function(){
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var n = 5, countEl = document.getElementById('count');
  function chime(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      var ac = new AC(), t = ac.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + i * 0.12);
        g.gain.exponentialRampToValueAtTime(0.25, t + i * 0.12 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.12 + 0.5);
        o.connect(g); g.connect(ac.destination);
        o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.55);
      });
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
  }
  var iv = setInterval(function(){
    n--;
    if (n <= 0) {
      clearInterval(iv);
      document.getElementById('stage-count').classList.add('hidden');
      document.getElementById('stage-hooray').classList.remove('hidden');
      chime();
      setTimeout(function(){ location.href = 'index.html'; }, 6000);
    } else {
      countEl.textContent = n;
      if (!reduced) {
        countEl.classList.add('tick');
        setTimeout(function(){ countEl.classList.remove('tick'); }, 300);
      }
    }
  }, 1000);
})();
</script>
</body>
</html>
