<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">

<meta property="og:description" content="Friday, October 2, 5:30&#8211;8:00 PM. Collect all 21 scarecrow selfies in your personal on-device album.">

<title>Scarecrow Selfie Story &mdash; Scarecrow Scavenger Hunt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
    repeating-linear-gradient(0deg, rgba(23,63,107,.055) 0 2px, transparent 2px 52px),
    repeating-linear-gradient(90deg, rgba(23,63,107,.055) 0 2px, transparent 2px 52px),
    #f7f1e3; color: #4c4132; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: calc(64px + env(safe-area-inset-top, 0px)) 20px 28px;
  }
  body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% -10%, rgba(232,163,61,.25), transparent 55%),
                radial-gradient(ellipse at 50% 115%, rgba(217,179,132,.30), transparent 55%); }
  main { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; margin: auto 0; max-width: 860px; width: 100%; }
  .kicker { color: #c85a17; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; font-weight: 700; }
  h1 { font-size: 30px; line-height: 1.2; margin: 8px 0 10px; color: #173f6b; }
  .progress { font-size: 1.05rem; color: #6b4a2a; font-weight: 700; margin-bottom: 8px; }
  .pbar { width: min(420px, 90%); height: 12px; border-radius: 999px; background: rgba(23,63,107,.15); overflow: hidden; margin-bottom: 14px; }
  .pbar > div { height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, #e8a33d, #d9481c); transition: width .6s ease; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 6px; }
  .btn { background: #173f6b; color: #fff; font-weight: 800; font-size: 1.05rem; border: none;
    border-radius: 999px; padding: 14px 30px; cursor: pointer; font-family: inherit; }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn.alt { background: #d9481c; box-shadow: 0 0 18px rgba(217,72,28,.35); }
  .notice { margin: 10px auto 0; max-width: 520px; background: #fffdf6; border: 2px solid rgba(200,90,23,.35);
    border-radius: 14px; padding: 12px 18px; color: #4a4033; line-height: 1.55; font-size: .95rem; }
  .notice[hidden] { display: none; }
  .taghint { display: block; margin-top: 10px; font-size: .88rem; }
  .tagcopy { margin: 4px 4px 0 0 !important; padding: 5px 14px !important; font-size: .85rem !important; }
  .notice button { margin-top: 8px; background: #fffdf6; color: #6b4a2a; font-weight: 700; font-size: .95rem;
    border: 2px solid rgba(200,90,23,.55); border-radius: 999px; padding: 9px 22px; cursor: pointer; font-family: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; width: 100%; margin-top: 16px; }
  .card { background: #fffdf6; border: 2px solid rgba(200,90,23,.25); border-radius: 14px; padding: 10px;
    display: flex; flex-direction: column; align-items: center; }
  .card .num { font-size: .8rem; font-weight: 800; letter-spacing: 1px; color: #c85a17; text-transform: uppercase; }
  .card .cname { font-size: .88rem; font-weight: 700; color: #173f6b; margin: 2px 0 8px; line-height: 1.25; min-height: 2.2em; }
  .thumb { width: 100%; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; background: rgba(23,63,107,.07); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .empty { width: 100%; aspect-ratio: 4 / 5; border-radius: 10px; border: 2px dashed rgba(200,90,23,.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 8px; }
  .empty span { font-size: .85rem; color: #a3937a; }
  .empty a { color: #c85a17; font-weight: 800; text-decoration: none; font-size: .95rem; }
  .crow { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  .crow button, .crow a { font-size: .82rem; font-weight: 700; border-radius: 999px; padding: 7px 14px;
    cursor: pointer; font-family: inherit; text-decoration: none; }
  .crow .share { background: #d9481c; color: #fff; border: none; }
  .crow .dl { background: #fffdf6; color: #6b4a2a; border: 2px solid rgba(200,90,23,.55); }
  .crow .retake { background: none; border: none; color: #a3937a; text-decoration: underline; padding: 7px 6px; }
  /* slideshow */
  #slideshow { position: fixed; inset: 0; z-index: 9500; background: rgba(15,20,30,.96);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #slideshow[hidden] { display: none; }
  #ssImg { max-width: min(92vw, 560px); max-height: 68vh; border-radius: 12px; box-shadow: 0 12px 50px rgba(0,0,0,.5); }
  #ssCap { color: #f7f1e3; margin-top: 12px; font-size: 1.05rem; font-weight: 700; }
  #ssCount { color: rgba(247,241,227,.65); margin-top: 4px; font-size: .9rem; }
  .ss-controls { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  .ss-controls button { background: rgba(247,241,227,.14); color: #f7f1e3; border: 2px solid rgba(247,241,227,.35);
    border-radius: 999px; font-size: 1.2rem; width: 52px; height: 52px; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; }
  .ss-controls button.wide { width: auto; padding: 0 22px; font-size: 1rem; font-weight: 700; height: 52px; }
  .ss-controls button:active { transform: scale(.95); }
  .priv { font-size: .85rem; color: #a3937a; margin-top: 20px; max-width: 520px; line-height: 1.5; }
  .priv strong { color: #6b5d49; }
  .credit { margin-top: 22px; font-size: .85rem; color: #a3937a; }
  .credit a { color: #c85a17; font-weight: 700; }
  .topnav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center;
    justify-content: space-between; padding: 10px 16px;
    background: rgba(247,241,227,.92); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(200,90,23,.25); }
  .topnav .navlinks a { color: #6b4a2a; font-weight: 700; text-decoration: none; margin-left: 14px; font-size: .95rem; }
  .ico { width: 1.15em; height: 1.15em; vertical-align: -0.2em; }
</style>
</head>
<body>
  <nav class="topnav" aria-label="Site">
    <span class="navlinks"><a href="index.html">Home</a><a href="map.html">Trail Map</a><a href="faq.html">FAQ</a></span>
  </nav>
  <main>
    <p class="kicker">Scarecrow Selfie Story</p>
    <h1>My 21-Stop Album</h1>
    <p class="progress"><span id="pcount">0</span> of 21 selfies saved</p>
    <div class="pbar" role="progressbar" aria-label="Selfies saved"><div id="pbarFill"></div></div>
    <div class="actions">
      <button type="button" class="btn alt" id="slideshowBtn" disabled>Play slideshow</button>
      <button type="button" class="btn" id="zipBtn" disabled>Download all as ZIP</button>
    </div>
    <div class="notice" id="shareNotice" hidden></div>
    <div class="grid" id="grid" aria-live="polite"></div>
    <p class="priv">Switching phones or clearing site data will remove your selfies &mdash; download your ZIP as a keepsake.</p>
    <p class="credit">Presented by the <a href="https://www.kaaonline.org">Kokomo Art Association</a></p>
  </main>

  <div id="slideshow" hidden role="dialog" aria-label="Selfie slideshow">
    <img id="ssImg" alt="Framed scarecrow selfie">
    <p id="ssCap"></p>
    <p id="ssCount"></p>
    <div class="ss-controls">
      <button type="button" id="ssPrev" aria-label="Previous photo">&#8249;</button>
      <button type="button" class="wide" id="ssPlay" aria-label="Pause autoplay">Pause</button>
      <button type="button" id="ssNext" aria-label="Next photo">&#8250;</button>
      <button type="button" class="wide" id="ssClose" aria-label="Close slideshow">Close</button>
    </div>
  </div>

<style>
#letsGoFab { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 9000;
  width: 58px; height: 58px; border-radius: 50%; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #d9481c, #e8722a 60%, #e8a33d); color: #fff;
  border: 2px solid rgba(255,255,255,.5); cursor: pointer;
  box-shadow: 0 6px 24px rgba(217,72,28,.55); animation: letsgo-pulse 2.6s ease-in-out infinite; }
#letsGoFab .ico { width: 27px; height: 27px; }
#letsGoFab:active { transform: scale(.93); }
@keyframes letsgo-pulse { 0%, 100% { box-shadow: 0 6px 24px rgba(217,72,28,.55); } 50% { box-shadow: 0 6px 32px rgba(232,163,61,.85); } }
@media (prefers-reduced-motion: reduce) { #letsGoFab { animation: none; } }

  var go = document.getElementById("letsGoFab");
  if (!go) return;

    location.href = "map.html#scan";

<script src="journey.js"></script>
<script>
(function () {
  "use strict";
  var grid = document.getElementById("grid");
  var pcount = document.getElementById("pcount");
  var pbarFill = document.getElementById("pbarFill");
  var slideshowBtn = document.getElementById("slideshowBtn");
  var zipBtn = document.getElementById("zipBtn");
  var notice = document.getElementById("shareNotice");
  var photos = {};   // stopN -> {blob, url}
  var order = [];    // saved stop numbers, sorted

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function captionFor(stop) {
    return "My scarecrow #" + stop.n + " selfie at " + stop.name + "! " + Journey.TOP_TAG + " " + stop.tag;
  }

  function render() {
    Journey.db.all().then(function (rows) {
      photos = {};
      order = [];
      rows.forEach(function (r) {
        if (!r || !r.blob) return;
        photos[r.stop] = { blob: r.blob, url: URL.createObjectURL(r.blob) };
        order.push(r.stop);
      });
      order.sort(function (a, b) { return a - b; });
      pcount.textContent = order.length;
      pbarFill.style.width = Math.round(order.length / 21 * 100) + "%";
      var has = order.length > 0;
      slideshowBtn.disabled = !has;
      zipBtn.disabled = !has;
      grid.innerHTML = "";
      Journey.STOPS.forEach(function (stop) {
        var card = document.createElement("div");
        card.className = "card";
        var head = '<div class="num">Scarecrow #' + stop.n + '</div>' +
                   '<div class="cname">' + escapeHtml(stop.name) + '</div>';
        if (photos[stop.n]) {
          card.innerHTML = head +
            '<div class="thumb"><img src="' + photos[stop.n].url + '" alt="Framed selfie at ' + escapeHtml(stop.name) + '"></div>' +
            '<div class="crow"><button type="button" class="share" data-share="' + stop.n + '">Share</button>' +
            '<button type="button" class="dl" data-dl="' + stop.n + '">Download</button>' +
            '<a class="retake" href="snap.html?stop=' + stop.n + '">Retake</a></div>';
        } else {
          card.innerHTML = head +
            '<div class="empty"><span>No selfie yet</span><a href="snap.html?stop=' + stop.n + '">Snap it &rarr;</a></div>';
        }
        grid.appendChild(card);
      });
    }, function () {
      grid.innerHTML = "<p>Couldn&rsquo;t read saved selfies on this device (private browsing can block storage).</p>";
    });
  }

  grid.addEventListener("click", function (ev) {
    var t = ev.target;
    var sn = t.getAttribute("data-share");
    if (sn) { sharePhoto(parseInt(sn, 10)); return; }
    var dn = t.getAttribute("data-dl");
    if (dn) { downloadPhoto(parseInt(dn, 10)); }
  });

  function downloadPhoto(stopN) {
    var p = photos[stopN];
    if (!p) return;
    Journey.downloadBlob(p.blob, Journey.zipName(Journey.stopByNumber(stopN)));
  }

  function sharePhoto(stopN) {
    var p = photos[stopN];
    var stop = Journey.stopByNumber(stopN);
    if (!p || !stop) return;
    var text = captionFor(stop);
    var file;
    try {
      file = new File([p.blob], Journey.zipName(stop), { type: "image/png" });
    } catch (e) { file = null; }
    if (!file) { downloadPhoto(stopN); showShareFallback(text, stopN); return; }
    Journey.shareFiles([file], "Scarecrow #" + stop.n + " selfie", text).then(function (ok) {
      if (!ok) { downloadPhoto(stopN); showShareFallback(text, stopN); }
    });
  }

  function showShareFallback(text, stopN) {
    var hint = "";
    var socials = Journey.socialsFor(stopN);
    if (socials.length) {
      var bits = socials.map(function (s, i) {
        return '<button type="button" class="tagcopy" data-tag="' + i + '">' + escapeHtml(s.h) + "</button> on " + escapeHtml(s.p);
      }).join(" &middot; ");
      hint = '<span class="taghint">Want to notify the sponsor so they can reshare it? Tag ' + bits +
             " (tap a handle to copy it).</span>";
    }
    notice.innerHTML = "Your browser couldn&rsquo;t open the share sheet, so the photo downloaded instead &mdash; " +
      "post it from your Photos app. Here&rsquo;s a caption to go with it:<br><strong>" + escapeHtml(text) + "</strong><br>" +
      '<button type="button" id="copyCap">Copy caption</button>' + hint;
    notice.hidden = false;
    document.getElementById("copyCap").addEventListener("click", function () {
      copyText(text, this);
    });
    var tagBtns = notice.querySelectorAll(".tagcopy");
    Array.prototype.forEach.call(tagBtns, function (b) {
      b.addEventListener("click", function () {
        copyText(socials[parseInt(b.getAttribute("data-tag"), 10)].h, b);
      });
    });
    notice.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function copyText(text, btn) {
    function done(ok) { btn.textContent = ok ? "Copied!" : "Copy failed \u2014 long-press to copy"; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else { done(false); }
  }

  zipBtn.addEventListener("click", function () {
    if (zipBtn.disabled) return;
    zipBtn.disabled = true;
    var label = zipBtn.textContent;
    zipBtn.textContent = "Preparing\u2026";
    Journey.db.all().then(function (rows) {
      var seq = Promise.resolve();
      var entries = [];
      rows.forEach(function (r) {
        var stop = Journey.stopByNumber(r.stop);
        if (!stop || !r.blob) return;
        seq = seq.then(function () {
          return r.blob.arrayBuffer();
        }).then(function (ab) {
          entries.push({ name: Journey.zipName(stop), data: new Uint8Array(ab) });
        });
      });
      return seq.then(function () { return entries; });
    }).then(function (entries) {
      if (!entries.length) throw new Error("empty");
      var zip = Journey.makeZip(entries);
      Journey.downloadBlob(zip, "kokomo-scarecrow-selfies.zip");
    }).catch(function () {
      notice.textContent = "Couldn't build the ZIP on this device — you can still download selfies one at a time.";
      notice.hidden = false;
    }).then(function () {
      zipBtn.disabled = false;
      zipBtn.textContent = label;
    });
  });

  /* ---------------- slideshow ---------------- */
  var ss = document.getElementById("slideshow");
  var ssImg = document.getElementById("ssImg");
  var ssCap = document.getElementById("ssCap");
  var ssCount = document.getElementById("ssCount");
  var ssPlay = document.getElementById("ssPlay");
  var idx = 0, timer = null;
  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function show(i) {
    idx = (i + order.length) % order.length;
    var stop = Journey.stopByNumber(order[idx]);
    ssImg.src = photos[order[idx]].url;
    ssImg.alt = "Framed selfie at " + stop.name;
    ssCap.textContent = "Scarecrow #" + stop.n + " \u2014 " + stop.name;
    ssCount.textContent = (idx + 1) + " / " + order.length;
  }
  function stopAuto() {
    if (timer) { clearInterval(timer); timer = null; }
    ssPlay.textContent = "Play";
    ssPlay.setAttribute("aria-label", "Resume autoplay");
  }
  function startAuto() {
    stopAuto();
    if (reduceMotion) return;
    timer = setInterval(function () { show(idx + 1); }, 4000);
    ssPlay.textContent = "Pause";
    ssPlay.setAttribute("aria-label", "Pause autoplay");
  }
  function openSs() {
    if (!order.length) return;
    ss.hidden = false;
    document.body.style.overflow = "hidden";
    show(0);
    startAuto();
    document.addEventListener("keydown", onKey);
  }
  function closeSs() {
    stopAuto();
    ss.hidden = true;
    document.body.style.overflow = "";
    document.removeEventListener("keydown", onKey);
  }
  function onKey(ev) {
    if (ev.key === "Escape") closeSs();
    else if (ev.key === "ArrowRight") { show(idx + 1); startAuto(); }
    else if (ev.key === "ArrowLeft") { show(idx - 1); startAuto(); }
  }
  slideshowBtn.addEventListener("click", openSs);
  document.getElementById("ssClose").addEventListener("click", closeSs);
  document.getElementById("ssPrev").addEventListener("click", function () { show(idx - 1); startAuto(); });
  document.getElementById("ssNext").addEventListener("click", function () { show(idx + 1); startAuto(); });
  ssPlay.addEventListener("click", function () { if (timer) stopAuto(); else startAuto(); });
  ss.addEventListener("click", function (ev) { if (ev.target === ss) closeSs(); });

  render();
})();
</script>
</body>
</html>
