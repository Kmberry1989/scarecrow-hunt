<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Scarecrow #6 &mdash; First Friday Scavenger Hunt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #1c1030; color: #fff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 28px 20px;
  }
  .kicker { color: #ffb347; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
  .num { color: #c9b8e8; font-size: 15px; margin-bottom: 26px; }
  .label { color: #ffb347; font-size: 17px; letter-spacing: 1px; text-transform: uppercase; }
  h1 { font-size: 30px; line-height: 1.2; margin: 8px 0 22px; }
  .logo-box {
    margin: 0 auto 30px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-box img { max-width: 240px; max-height: 140px; object-fit: contain; }
  .letter {
    font-size: min(44vw, 190px); font-weight: 800; line-height: 1;
    color: #ffd166; margin: 10px 0 30px;
    text-shadow: 0 4px 0 #b3541e, 0 8px 24px rgba(0,0,0,.5);
  }
  .foot { color: #c9b8e8; font-size: 14px; line-height: 1.6; max-width: 340px; }
</style>
</head>
<body>
  <p class="kicker">&#127875; First Friday Scarecrow Scavenger Hunt</p>
  <p class="num">Scarecrow #6 of 21</p>
  <p class="label">Sponsored by</p>
  <h1>Kokomo Area Lions</h1>
  <div class="logo-box"><img src="logos/logo-06.png" alt="Kokomo Area Lions logo" onerror="this.remove()"></div>
  <p class="label">Your letter is</p>
  <div class="letter">N</div>
  <p class="foot">Write it in slot #6 of your passport. Collect all 21 letters, then turn in your passport at Artworks Gallery to enter the gift basket drawing!</p>
  <script data-goatcounter="https://kmberry1989.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
